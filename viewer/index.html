<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'self'; img-src 'self' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https: data:"
    />
    <title>Architecture map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      id="fontsheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
    <style id="brandvars"></style>
  </head>
  <body>
    <div class="app">
      <header class="bar">
        <div class="r1">
          <div class="brand">
            <img id="logo" alt="" hidden />
            <div class="title">
              <h1 id="title">Architecture map</h1>
              <p id="sub">Loading…</p>
            </div>
          </div>
          <span class="hlinks" id="hlinks"></span>
          <div class="modes">
            <button
              type="button"
              class="tbtn"
              id="bStart"
              aria-pressed="false"
              aria-controls="start"
            >
              Start here
            </button>
            <div
              class="seg"
              id="detail"
              role="group"
              aria-label="How much detail"
            >
              <button type="button" id="bSimple" aria-pressed="false">
                Simple
              </button>
              <button type="button" id="bDetailed" aria-pressed="true">
                Detailed
              </button>
            </div>
          </div>
        </div>
        <div class="r2">
          <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
          <label class="search" for="q">
            <svg viewBox="0 0 12 12" aria-hidden="true">
              <circle cx="5" cy="5" r="3.6" />
              <path d="M8 8l3 3" />
            </svg>
            <input
              id="q"
              type="search"
              placeholder="Find a service, table or column"
              autocomplete="off"
              aria-label="Find a service, table or column"
            />
          </label>
          <label class="toggle" for="fadePerson" id="fadeWrap" hidden
            ><input id="fadePerson" type="checkbox" checked /> Fade links to
            person</label
          >
          <button type="button" class="tbtn" id="bDiagram" aria-pressed="false">
            Diagram
          </button>
          <button type="button" class="tbtn" id="bExport" hidden>
            Download image
          </button>
          <button type="button" class="tbtn" id="bFlows">Flows</button>
          <button type="button" class="tbtn" id="bEnums" hidden>
            Enum types
          </button>
        </div>
        <nav class="r3" id="chips" aria-label="Areas"></nav>
        <nav class="r3" id="personas" aria-label="Personas" hidden>
          <span class="navlbl">Personas</span>
        </nav>
      </header>
      <main
        class="viewport"
        id="vp"
        aria-label="Map. Drag to pan, scroll to zoom, click an item for details."
      >
        <div class="world" id="world">
          <div id="zoneLayer"></div>
          <svg class="edges" id="edges" aria-hidden="true"></svg>
          <div id="cardLayer"></div>
        </div>
        <div class="msg" id="msg" hidden>
          <div>
            <h2 id="msgH"></h2>
            <p id="msgP"></p>
          </div>
        </div>
        <div class="bottombar">
          <div class="controls">
            <button type="button" id="zin" aria-label="Zoom in">+</button>
            <button type="button" id="zout" aria-label="Zoom out">−</button>
            <button type="button" id="fit">Fit</button>
            <button type="button" id="reset">Reset layout</button>
          </div>
          <div class="filters" id="filters"></div>
        </div>
        <canvas
          class="mini"
          id="mini"
          aria-label="Minimap: click to move the view"
        ></canvas>
        <aside
          class="panel"
          id="panel"
          hidden
          aria-labelledby="panelTitle"
        ></aside>
        <section
          class="lists"
          id="lists"
          aria-labelledby="listsTitle"
          hidden
        ></section>
        <div class="dlegend" id="dlegend" hidden>
          <span><i class="k-live"></i>Live</span>
          <span><i class="k-planned"></i>Planned</span>
          <span><i class="k-retiring"></i>Retiring</span>
          <span><i class="k-store"></i>Stores data</span>
          <span><i class="k-open"></i>To confirm</span>
          <span><i class="k-line"></i>Call</span>
          <span><i class="k-line k-async"></i>Push, event or webhook</span>
        </div>
        <div class="sr-only" id="live" aria-live="polite"></div>
        <section class="start" id="start" aria-label="Start here" hidden>
          <article>
            <div class="doc" id="startBody"></div>
            <p>
              <button type="button" class="tbtn primary" id="startGo">
                Open the map
              </button>
            </p>
          </article>
        </section>
      </main>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
