name: Architecture map

on: pull_request

permissions:
  contents: read

jobs:
  archmap:
    runs-on: ubuntu-latest
    steps:
      # drift compares against the base branch, so it needs the full history
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # fails the pull request when a save is invalid or leaves broken references
      - name: Check the map
        run: node .archmap/bin/archmap.mjs check
      # warns about uncovered changes; never fails the job
      - name: Check for drift
        run: node .archmap/bin/archmap.mjs drift --base origin/${{ github.base_ref }}
