name: Architecture map

on: pull_request

permissions:
  contents: read

jobs:
  # Required, no AI: fails the pull request when the map is invalid or the
  # change touches the architecture without touching the map.
  check:
    needs: map
    # runs whatever the map job did, except when it pushed: that push starts
    # a new run, which checks the new head
    if: always() && needs.map.outputs.pushed != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the map
        run: __CLI__ check --base origin/${{ github.base_ref }}

  # Not required: an agent updates the map and pushes it to the PR branch.
  map:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    concurrency:
      group: archmap-map-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          # a push with the default token starts no new run, so use a
          # GitHub App or fine-grained token with contents write
          token: ${{ secrets.ARCHMAP_PUSH_TOKEN || github.token }}
      # the map job's own commits start with "archmap: "; don't answer them
      - name: Skip the map job's own commits
        id: guard
        run: |
          if [[ "$(git log -1 --format=%s)" == "archmap: "* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 24
      # the agent that archmap.config.json's agent.command runs; swap this
      # step to install a different agent
      - name: Install the agent
        if: steps.guard.outputs.skip != 'true'
        run: npm install -g @anthropic-ai/claude-code
      - name: Update the map
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: __CLI__ agent --base origin/${{ github.base_ref }} | tee "$RUNNER_TEMP/archmap-agent.txt"
      - name: Commit and publish the map
        id: push
        if: steps.guard.outputs.skip != 'true'
        env:
          PUSH_TOKEN: ${{ secrets.ARCHMAP_PUSH_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          committed=false
          last="$(tail -n 1 "$RUNNER_TEMP/archmap-agent.txt")"
          if [ -n "$(git status --porcelain -- __DIR__)" ]; then
            git add -A -- __DIR__
            git commit -m "archmap: update map"
            {
              echo "### Map files changed"
              git diff --name-only HEAD~1 -- __DIR__
            } >> "$GITHUB_STEP_SUMMARY"
            committed=true
          elif [[ "$last" == "No map change: "* ]]; then
            git commit --allow-empty -m "archmap: no map change" -m "Archmap: none - ${last#No map change: }"
            committed=true
          fi
          if [ "$committed" = true ]; then
            if [ -n "$PUSH_TOKEN" ]; then
              git push origin "HEAD:$HEAD_REF"
              echo "pushed=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::The map job has a commit to push but no ARCHMAP_PUSH_TOKEN secret. Add one (a push with the default token starts no new run, so the required check would be missing on the new head). Nothing was pushed."
            fi
          fi
